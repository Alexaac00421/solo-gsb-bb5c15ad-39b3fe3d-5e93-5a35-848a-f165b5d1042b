# 一键启动：docker compose up --build
# 服务地址：http://localhost:8000 （交互式文档 http://localhost:8000/docs）
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy
      POSTGRES_DB: policydb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policydb"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://policy:policy@db:5432/policydb
      # 启动时等待数据库就绪的最大重试次数（秒）
      DB_INIT_MAX_ATTEMPTS: "60"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  dbdata:
